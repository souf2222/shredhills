services:
  shredhills:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_DB=${VITE_FIREBASE_DB}
    container_name: shredhills
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shredhills.rule=Host(`${SHREDHILLS_DOMAIN}`)"
      - "traefik.http.routers.shredhills.entrypoints=https"
      - "traefik.http.routers.shredhills.tls=true"
      - "traefik.http.services.shredhills.loadbalancer.server.port=80"
    networks:
      - qcav-network1

networks:
  qcav-network1:
    external: true
