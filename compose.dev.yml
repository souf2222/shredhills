services:
  shredhills-dev:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite inlines these into the JS bundle at build time, so they must be
      # passed as build args (not runtime env on the nginx container).
      args:
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}
        - VITE_FIREBASE_DB=${VITE_FIREBASE_DB}
    container_name: shredhills-dev
    restart: unless-stopped
    ports:
      - "3010:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.shredhills-dev.rule=Host(`${SHREDHILLS_DOMAIN}`)"
      - "traefik.http.routers.shredhills-dev.entrypoints=https"
      - "traefik.http.routers.shredhills-dev.tls=true"
      - "traefik.http.services.shredhills-dev.loadbalancer.server.port=80"
    networks:
      - qcav-network1

networks:
  qcav-network1:
    external: true
