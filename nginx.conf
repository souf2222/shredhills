server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # SPA fallback - serve index.html for all routes.
    # Internal redirects to /index.html re-match the exact location below,
    # so every HTML response gets no-cache.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html references hashed assets, so it must always revalidate.
    # Without this, browsers heuristically cache it and users keep getting
    # the old bundle after a deploy.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Hashed static assets: safe to cache forever.
    # Single Cache-Control header (no "expires" to avoid a duplicate header).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
